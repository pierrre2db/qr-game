<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Game - Générateur Direct</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    body {
      padding: 20px;
    }
    .qr-container {
      text-align: center;
      margin: 20px 0;
    }
    #status {
      margin-top: 20px;
    }
    .question-card {
      margin-bottom: 15px;
      border-radius: 8px;
      overflow: hidden;
    }
    .question-title {
      font-weight: bold;
    }
    .qr-image {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="mb-4">Générateur QR Direct</h1>
    
    <div class="row mb-4">
      <div class="col-12">
        <div class="card">
          <div class="card-header bg-primary text-white">
            <h5 class="card-title mb-0">Générer des QR codes pour toutes les questions</h5>
          </div>
          <div class="card-body">
            <p>Cette page utilise le service <a href="https://api.qrserver.com/" target="_blank">QR Code API</a> pour générer des QR codes sans bibliothèque JavaScript.</p>
            <div class="d-grid gap-2">
              <button id="load-questions-btn" class="btn btn-primary">
                <i class="bi bi-arrow-repeat"></i> Charger les questions
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <div id="status" class="alert alert-info">
      Cliquez sur "Charger les questions" pour commencer
    </div>
    
    <div id="questions-container" class="row">
      <!-- Les questions seront chargées ici -->
    </div>
    
    <div class="mt-4">
      <a href="index.html" class="btn btn-secondary">Retour à l'accueil</a>
    </div>
  </div>
  
  <script>
    // Éléments DOM
    const loadQuestionsBtn = document.getElementById('load-questions-btn');
    const questionsContainer = document.getElementById('questions-container');
    const statusElement = document.getElementById('status');
    
    // Charger les questions
    loadQuestionsBtn.addEventListener('click', async () => {
      try {
        statusElement.className = 'alert alert-info';
        statusElement.textContent = 'Chargement des questions...';
        
        const response = await fetch('/api/questions');
        if (!response.ok) {
          throw new Error(`Erreur HTTP: ${response.status}`);
        }
        
        const data = await response.json();
        const questions = data.questions || [];
        
        if (!questions.length) {
          statusElement.className = 'alert alert-warning';
          statusElement.textContent = 'Aucune question trouvée dans la base de données.';
          return;
        }
        
        statusElement.className = 'alert alert-success';
        statusElement.textContent = `${questions.length} questions chargées avec succès.`;
        
        // Afficher les questions et générer les QR codes
        displayQuestions(questions);
      } catch (error) {
        console.error('Erreur lors du chargement des questions:', error);
        statusElement.className = 'alert alert-danger';
        statusElement.textContent = `Erreur: ${error.message || 'Erreur inconnue'}`;
      }
    });
    
    // Afficher les questions et générer les QR codes
    function displayQuestions(questions) {
      questionsContainer.innerHTML = '';
      
      questions.forEach(question => {
        // Créer l'URL pour le QR code
        const gameUrl = `${window.location.origin}/game.html?q=${question.id}`;
        
        // Créer l'URL pour l'API QR code
        const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(gameUrl)}`;
        
        // Créer la carte pour la question
        const questionCard = document.createElement('div');
        questionCard.className = 'col-md-4 mb-4';
        questionCard.innerHTML = `
          <div class="card question-card h-100">
            <div class="card-header d-flex justify-content-between align-items-center">
              <span class="question-title">${question.id}</span>
              <a href="${qrUrl}" download="qr_${question.id}.png" class="btn btn-sm btn-outline-primary">
                <i class="bi bi-download"></i> Télécharger
              </a>
            </div>
            <div class="card-body text-center">
              <img src="${qrUrl}" alt="QR Code pour ${question.id}" class="qr-image mb-3">
              <h6>${question.title}</h6>
              <small class="text-muted">${question.type}</small>
            </div>
            <div class="card-footer">
              <a href="${gameUrl}" target="_blank" class="btn btn-sm btn-outline-secondary w-100">
                Tester le lien
              </a>
            </div>
          </div>
        `;
        
        questionsContainer.appendChild(questionCard);
      });
    }
    
    // Charger automatiquement les questions au démarrage
    document.addEventListener('DOMContentLoaded', () => {
      loadQuestionsBtn.click();
    });
  </script>
</body>
</html>
