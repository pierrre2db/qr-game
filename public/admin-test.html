<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Game - Test Admin</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <style>
    body {
      padding: 20px;
    }
    .login-container {
      max-width: 400px;
      margin: 100px auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .login-title {
      text-align: center;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="login-container">
      <h2 class="login-title">QR Game - Administration</h2>
      <form id="login-form">
        <div class="mb-3">
          <label for="username" class="form-label">Nom d'utilisateur</label>
          <input type="text" class="form-control" id="username" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Mot de passe</label>
          <input type="password" class="form-control" id="password" required>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary">Connexion</button>
        </div>
      </form>
      <div class="mt-3 text-center">
        <small class="text-muted">Utilisateur par défaut : admin / admin123</small>
      </div>
    </div>
    
    <div id="admin-content" style="display: none;">
      <div class="alert alert-success">
        <h4>Connexion réussie !</h4>
        <p>Vous êtes connecté à l'interface d'administration.</p>
        <a href="admin.html" class="btn btn-primary">Accéder à l'interface complète</a>
        <button id="logout-button" class="btn btn-outline-danger">Déconnexion</button>
      </div>
    </div>
  </div>
  
  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    // Clé de stockage du token d'authentification
    const AUTH_TOKEN_KEY = 'qr_game_admin_token';
    
    // Utilisateur par défaut
    const DEFAULT_USER = {
      username: 'admin',
      password: 'admin123',
      name: 'Administrateur',
      email: 'admin@example.com'
    };
    
    // Vérifier si l'utilisateur est déjà connecté
    function isAuthenticated() {
      const token = localStorage.getItem(AUTH_TOKEN_KEY);
      return !!token;
    }
    
    // Connecter l'utilisateur
    function login(username, password) {
      if (username === DEFAULT_USER.username && password === DEFAULT_USER.password) {
        // Générer un token simulé
        const token = Date.now().toString(36) + Math.random().toString(36).substring(2);
        
        // Stocker le token
        localStorage.setItem(AUTH_TOKEN_KEY, token);
        
        // Stocker les informations de l'utilisateur
        localStorage.setItem('qr_game_admin_user', JSON.stringify({
          name: DEFAULT_USER.name,
          email: DEFAULT_USER.email
        }));
        
        // Afficher le contenu admin
        document.querySelector('.login-container').style.display = 'none';
        document.getElementById('admin-content').style.display = 'block';
        
        return true;
      } else {
        alert('Nom d\'utilisateur ou mot de passe incorrect');
        return false;
      }
    }
    
    // Déconnecter l'utilisateur
    function logout() {
      localStorage.removeItem(AUTH_TOKEN_KEY);
      localStorage.removeItem('qr_game_admin_user');
      
      // Afficher le formulaire de connexion
      document.querySelector('.login-container').style.display = 'block';
      document.getElementById('admin-content').style.display = 'none';
    }
    
    // Initialiser l'authentification
    document.addEventListener('DOMContentLoaded', function() {
      // Vérifier si l'utilisateur est déjà connecté
      if (isAuthenticated()) {
        document.querySelector('.login-container').style.display = 'none';
        document.getElementById('admin-content').style.display = 'block';
      }
      
      // Gestionnaire pour le formulaire de connexion
      const loginForm = document.getElementById('login-form');
      loginForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        
        login(username, password);
      });
      
      // Gestionnaire pour le bouton de déconnexion
      const logoutButton = document.getElementById('logout-button');
      logoutButton.addEventListener('click', logout);
    });
  </script>
</body>
</html>
