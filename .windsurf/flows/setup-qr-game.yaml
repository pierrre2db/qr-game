  - name: create_qr_scanner
    description: Créer le module de scanner QR
    write_file:
      path: public/js/qrscanner.js
      content: |
        // QR Scanner functionality
        let html5QrCode;

        // Initialize QR Scanner
        function initQRScanner() {
          if (!html5QrCode) {
            html5QrCode = new Html5Qrcode("qr-reader");
          }
          
          const qrConfig = { fps: 10, qrbox: { width: 250, height: 250 } };
          
          // Start scanner with camera
          html5QrCode.start(
            { facingMode: "environment" }, 
            qrConfig,
            onScanSuccess,
            onScanFailure
          ).catch(err => {
            console.error(`Unable to start scanning: ${err}`);
            showToast('Camera access denied or not available');
          });
        }

        // Success callback when QR code is scanned
        function onScanSuccess(decodedText, decodedResult) {
          // Stop scanning
          closeQRScanner();
          
          // Process the result
          console.log(`QR Code detected: ${decodedText}`);
          processQRResult(decodedText);
        }

        // Failure callback
        function onScanFailure(error) {
          // Handle scan failure, usually better to ignore and keep scanning
          console.warn(`QR scan error: ${error}`);
        }

        // Close QR Scanner
        function closeQRScanner() {
          if (html5QrCode && html5QrCode.isScanning) {
            html5QrCode.stop().catch(err => {
              console.error(`Unable to stop scanning: ${err}`);
            });
          }
        }

  - name: create_forms_integration
    description: Créer le module d'intégration Google Forms
    write_file:
      path: public/js/forms-integration.js
      content: |
        /**
         * Module d'intégration avec Google Forms via Apps Script
         */

        class FormsIntegration {
          constructor() {
            // URL du déploiement Web Apps Script (à remplacer par votre URL de déploiement)
            this.scriptUrl = 'https://script.google.com/macros/s/VOTRE_ID_DE_DEPLOIEMENT/exec';
          }

          /**
           * Soumet les données du joueur au formulaire Google
           * @param {Object} playerData - Données du joueur à soumettre
           * @returns {Promise} - Promesse résolue avec la réponse du serveur
           */
          async submitPlayerData(playerData) {
            try {
              // Vérifier si nous sommes en ligne
              if (!navigator.onLine) {
                // Stocker les données localement pour soumission ultérieure
                this.storeDataForLaterSubmission(playerData);
                return {
                  status: 'pending',
                  message: 'Données stockées localement pour soumission ultérieure'
                };
              }

              // Préparer les données à envoyer
              const response = await fetch(this.scriptUrl, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify(playerData)
              });

              // Vérifier si la requête a réussi
              if (!response.ok) {
                throw new Error(`Erreur HTTP: ${response.status}`);
              }

              // Analyser la réponse JSON
              const data = await response.json();
              return data;
            } catch (error) {
              console.error('Erreur lors de la soumission des données:', error);
              
              // Stocker les données localement en cas d'échec
              this.storeDataForLaterSubmission(playerData);
              
              return {
                status: 'error',
                message: `Erreur: ${error.message}. Données stockées localement.`
              };
            }
          }

          /**
           * Stocke les données localement pour une soumission ultérieure
           * @param {Object} playerData - Données du joueur à stocker
           */
          storeDataForLaterSubmission(playerData) {
            // Implémentation du stockage local...
          }
        }

        // Créer une instance globale
        const formsIntegration = new FormsIntegration();

  - name: create_google_apps_script
