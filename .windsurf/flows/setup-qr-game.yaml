  - name: create_readme
    description: Créer un README pour le projet
    write_file:
      path: README.md
      content: |
        # QR Game - PWA QR Scanner App with Deep Linking

        Une Progressive Web Application (PWA) qui permet aux utilisateurs de scanner des codes QR dans le cadre d'une expérience de jeu interactive. L'application prend en charge les liens profonds vers des défis spécifiques.

        ## Fonctionnalités

        - Progressive Web App (installable sur les appareils)
        - Fonctionnalité de scan de codes QR
        - Deep linking vers des défis spécifiques
        - Support hors ligne via le cache du service worker
        - Suivi et persistance de la progression du jeu
        - Intégration avec Google Forms pour la collecte de données

        ## Stack Technique

        - Frontend: HTML, CSS, JavaScript
        - Scan QR: Bibliothèque HTML5-QRCode
        - Backend: Node.js avec Express
        - Fonctionnalités PWA: Service Worker, Web App Manifest
        - Intégration: Google Apps Script

        ## Démarrage

        ### Prérequis

        - Node.js (v14 ou supérieur)
        - npm (v6 ou supérieur)

        ### Installation

        1. Clonez le dépôt
        2. Installez les dépendances:
           ```
           npm install
           ```
        3. Démarrez le serveur de développement:
           ```
           npm run dev
           ```
        4. Ouvrez votre navigateur et accédez à `http://localhost:3000`

        ## Comment jouer

        1. Commencez une nouvelle partie ou reprenez une partie existante
        2. Scannez des codes QR pour progresser à travers les défis
        3. Chaque code QR doit contenir une URL au format: `https://votredomaine.com/game/idDuDefi`
        4. Complétez tous les défis pour terminer le jeu

        ## Création de codes QR

        Vous pouvez créer des codes QR pour le jeu en utilisant n'importe quel générateur de codes QR. Chaque code QR doit encoder une URL au format suivant:

        ```
        https://votredomaine.com/game/idDuDefi
        ```

        Où `idDuDefi` correspond aux ID de défis définis dans l'application:
        - start
        - challenge1
        - challenge2
        - challenge3
        - challenge4
        - finish

        ## Déploiement

        Cette application peut être déployée sur n'importe quel service d'hébergement statique ou plateforme d'hébergement Node.js comme Netlify, Vercel ou Heroku.

        ## Intégration Google Forms

        Consultez le fichier `README-FORMS.md` pour obtenir des instructions détaillées sur la configuration de l'intégration avec Google Forms.
