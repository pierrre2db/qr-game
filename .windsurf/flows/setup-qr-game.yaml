name: setup-qr-game
description: Génère squelette PWA, scanner JS, Apps Script pour Google Forms
version: 1.0.0
author: Cascade

steps:
  - name: create_project_structure
    description: Créer la structure de base du projet
    run: |
      mkdir -p public/{js,css,images}
      mkdir -p google-apps-script
      mkdir -p scripts
      touch .env

  - name: install_dependencies
    description: Installer les dépendances nécessaires
    run: |
      npm init -y
      npm install express body-parser cors dotenv
      npm install --save-dev nodemon
      npm install qrcode html5-qrcode

  - name: create_server
    description: Créer le serveur Express
    write_file:
      path: server.js
      content: |
        require('dotenv').config();
        const express = require('express');
        const bodyParser = require('body-parser');
        const cors = require('cors');
        const path = require('path');

        const app = express();
        const PORT = process.env.PORT || 3000;

        // Middleware
        app.use(cors());
        app.use(bodyParser.json());
        app.use(bodyParser.urlencoded({ extended: true }));
        app.use(express.static(path.join(__dirname, 'public')));

        // Routes
        app.get('/api/health', (req, res) => {
          res.json({ status: 'ok' });
        });

        // Handle deep linking routes
        app.get('/game/:gameId', (req, res) => {
          res.sendFile(path.join(__dirname, 'public', 'index.html'));
        });

        // Fallback route for SPA
        app.get('*', (req, res) => {
          res.sendFile(path.join(__dirname, 'public', 'index.html'));
        });

        // Start server
        app.listen(PORT, () => {
          console.log(`Server running on port ${PORT}`);
        });

